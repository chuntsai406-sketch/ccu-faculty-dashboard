name: Auto Daily Faculty Views Crawler

on:
  schedule:
    # 每天台灣時間凌晨 02:00 (UTC 18:00) 於雲端自動執行
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright pandas
          playwright install chromium

      - name: Run Crawler
        run: python crawler.py

      - name: Commit and Push DB Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ccu_faculty.db
          git commit -m "Auto update daily faculty views [skip ci]" || exit 0
          git push
