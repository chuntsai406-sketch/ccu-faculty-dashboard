name: Auto Daily Faculty Crawler

on:
  schedule:
    # 每天台灣時間凌晨 01:15 (UTC 18:00) 自動執行
    - cron: '0 18 * * *'
  workflow_dispatch: # 允許您隨時在 GitHub 網頁上點按鈕手動觸發

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright pandas
          playwright install chromium

      - name: Run Crawler
        run: python crawler.py

      - name: Commit and Push DB Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ccu_faculty.db
          git commit -m "Auto update daily faculty views [skip ci]" || exit 0
          git push
